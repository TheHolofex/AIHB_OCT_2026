  <title id="m03-mcp-layers-title">Three layers refuse a call, and a fourth records it</title>
  <desc id="m03-mcp-layers-desc">A model&apos;s tool request meets three layers that can refuse it and one that records what happened. The allow-list hides tools you did not name. The guard blocks an undeclared call before it runs. The server&apos;s own limits refuse what is outside its folders. The server log and the files on disk record what actually happened.</desc>
